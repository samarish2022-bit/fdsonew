# FDSO test site — https://fdso.rockchat1.ru
# Install: copy to /etc/nginx/sites-available/fdso and enable.
# Then: certbot --nginx -d fdso.rockchat1.ru
# After certbot, SSL listen/ssl_* lines are added automatically (or use the
# post-certbot layout below).

# HTTPS — domain (requires certificates from Let's Encrypt)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fdso.rockchat1.ru;

    ssl_certificate /etc/letsencrypt/live/fdso.rockchat1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fdso.rockchat1.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# HTTP — redirect domain to HTTPS; keep IP access for convenience
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fdso.rockchat1.ru 94.232.46.243;

    client_max_body_size 50m;

    if ($host = fdso.rockchat1.ru) {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
